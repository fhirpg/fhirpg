[package]
name = "fhirpg"
description = "FHIR in PostgreSQL, relationally: normalized storage plus a FHIR REST server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fhirpg"
path = "src/main.rs"

[dependencies]
fhirpg-map.workspace = true
fhirpg-gen.workspace = true
fhirpg-store.workspace = true
fhirpg-server.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
flate2.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Typed validation for every version. 1.2.1 is the floor: 1.2.0's r3/r4
# features did not compile for published-crate users, because the `Validate`
# derive expanded to `crate::r5::` paths (fixed in fhir-derive-macros 1.0.1).
fhir = { version = "1.2.1", optional = true, features = ["r3", "r4"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }

[features]
validate = ["dep:fhir"]
tls = ["dep:axum-server"]
