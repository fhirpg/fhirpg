[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "One-shot generator for fhirpg's FHIR schema and transform assets."

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] } # Reads the FHIR spec and writes the assets; `preserve_order` keeps emitted keys stable.

[lints]
workspace = true
