# PostgreSQL 18 for local development and the #[ignore]d database tests.
#
# Run with Podman (decision D11):
#
#   podman compose up -d
#   podman compose down          # add -v to also drop the data volume
#
# `podman compose` delegates to an external provider (podman-compose or
# docker-compose). If you do not have one installed, this is the equivalent:
#
#   podman run -d --name fhirpg-db -p 5433:5432 \
#     -e POSTGRES_USER=fhirpg -e POSTGRES_PASSWORD=fhirpg -e POSTGRES_DB=fhirpg \
#     -v fhirpg-pgdata:/var/lib/postgresql/data \
#     docker.io/library/postgres:18
#
# Then:
#
#   FHIRPG_TEST_DB="host=localhost port=5433 user=fhirpg password=fhirpg dbname=fhirpg" \
#     cargo test -- --ignored
#
# This file stays within the plain Compose specification — no Docker-specific
# extensions — so it works under any provider.

services:
  db:
    # PostgreSQL 18 is required (decision D8): `uuidv7()` for identifier
    # generation (D12) and `RETURNING OLD`/`NEW` in the stored procedures (D13).
    # The default image includes contrib, so the legacy assets'
    # `CREATE EXTENSION pgcrypto` succeeds here — but nothing may depend on it,
    # and `init` must also pass against an image without contrib (D9).
    image: docker.io/library/postgres:18
    container_name: fhirpg-db
    environment:
      POSTGRES_USER: fhirpg
      POSTGRES_PASSWORD: fhirpg
      POSTGRES_DB: fhirpg
    ports:
      # 5433 on the host, to avoid colliding with a local PostgreSQL on 5432,
      # and above 1024 so rootless Podman can bind it without privileges.
      - "5433:5432"
    volumes:
      # A named volume rather than a bind mount: rootless Podman maps user
      # namespaces, and a bind mount into the host filesystem hits ownership
      # problems that a named volume avoids.
      - fhirpg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhirpg -d fhirpg"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  fhirpg-pgdata:
