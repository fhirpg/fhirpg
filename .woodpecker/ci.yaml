# Build, lint, test — the mirror of .github/workflows/ci.yml `test` and
# `msrv` jobs, so a Codeberg push is gated exactly as a GitHub push is.
#
# Woodpecker shares the workspace between steps of one pipeline but gives no
# cache between pipelines, so CARGO_HOME and CARGO_TARGET_DIR are pinned into
# the workspace: the steps below then reuse one download and one target dir
# instead of rebuilding the dependency graph four times.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

variables:
  - &rust "docker.io/library/rust:1"
  - &cargo_env
    CARGO_TERM_COLOR: always
    CARGO_HOME: /woodpecker/src/.cargo
    CARGO_TARGET_DIR: /woodpecker/src/target

steps:
  - name: fmt
    image: *rust
    environment: *cargo_env
    commands:
      - rustup component add rustfmt
      - cargo fmt --all --check

  - name: clippy
    image: *rust
    environment: *cargo_env
    commands:
      - rustup component add clippy
      - cargo clippy --all-targets --locked -- -D warnings

  # Unit tests pass with no database and no spec packages present; the
  # corpus- and spec-driven tests skip themselves when their inputs are
  # absent. The live-database run is .woodpecker/database.yaml.
  - name: test
    image: *rust
    environment: *cargo_env
    commands:
      - cargo test --workspace --locked

  # `rust-version` in Cargo.toml is a promise to downstream users; without a
  # build on exactly that toolchain it is only a claim, and it breaks silently
  # the first time anyone uses a newer language feature.
  - name: msrv
    image: *rust
    environment: *cargo_env
    commands:
      - msrv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
      - echo "MSRV is $msrv"
      - rustup toolchain install "$msrv" --profile minimal
      - cargo "+$msrv" check --workspace --all-targets --locked

  - name: book
    image: *rust
    environment: *cargo_env
    commands:
      - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
      - ./mdbook build book
