[package]
name = "fhirpg-server"
description = "FHIR RESTful API server over the fhirpg relational store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fhirpg-map.workspace = true
fhirpg-store.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }

[dev-dependencies]
fhirpg-gen.workspace = true
http-body-util = "0.1"
fhirpg-store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
