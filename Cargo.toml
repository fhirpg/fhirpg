[workspace]
resolver = "3"
members = [
    "crates/fhirpg-map",
    "crates/fhirpg-gen",
    "crates/fhirpg-store",
    "crates/fhirpg-server",
    "crates/fhirpg",
]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joelparkerhenderson/fhirpg"
rust-version = "1.90"

[workspace.dependencies]
fhirpg-map = { path = "crates/fhirpg-map" }
fhirpg-gen = { path = "crates/fhirpg-gen" }
fhirpg-store = { path = "crates/fhirpg-store" }
fhirpg-server = { path = "crates/fhirpg-server" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
